name: Full Laya experiment

on:
  workflow_dispatch:
    inputs:
      refresh_snapshot:
        description: "Fetch current public APM issues instead of the frozen snapshot"
        type: boolean
        default: false

permissions:
  contents: read

env:
  USE_TF: "0"
  TOKENIZERS_PARALLELISM: "false"
  HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - name: Capture the source once for every runner
        if: inputs.refresh_snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python experiment.py snapshot
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: experiment-source
          path: data/snapshot.json
          if-no-files-found: error
          retention-days: 14

  infer:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: experiment-source
          path: data
      - name: Install pinned CPU runtime
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Run genuine inference on this partition
        env:
          SHARD: ${{ matrix.shard }}
        run: python -u sharding.py run --index "$SHARD" --count 8 --output "runs/shard-$SHARD"
      - name: Preserve raw shard evidence, including partial failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: laya-shard-${{ matrix.shard }}
          path: runs/shard-${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 14

  report:
    needs: infer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: experiment-source
          path: data
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: laya-shard-*
          path: downloaded-shards
      - name: Verify coverage and build the full report
        run: python sharding.py combine --shards-root downloaded-shards
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: full-laya-report
          path: |
            runs/actions/
            REPORT-actions.md
          if-no-files-found: error
          retention-days: 14
