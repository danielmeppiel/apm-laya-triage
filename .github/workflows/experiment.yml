name: Laya experiment

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Issue count for a smoke run; 0 means the whole corpus"
        type: string
        default: "25"
        required: true
      refresh_snapshot:
        description: "Fetch current APM issues instead of the frozen snapshot"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      USE_TF: "0"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate offline scoring and read-only boundaries
        run: python -m unittest discover -s tests -v
      - name: Install pinned CPU runtime
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Refresh public issue snapshot
        if: inputs.refresh_snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python experiment.py snapshot
      - name: Infer locally
        env:
          LIMIT: ${{ inputs.limit }}
        run: |
          if [[ ! "$LIMIT" =~ ^(0|[1-9][0-9]*)$ ]]; then
            echo "[x] limit must be 0 or a positive integer." >&2
            exit 1
          fi
          args=()
          if [[ "$LIMIT" != "0" ]]; then
            args=(--limit "$LIMIT")
          fi
          python -u experiment.py run --output runs/actions --device cpu "${args[@]}"
      - name: Generate full-corpus report
        if: inputs.limit == '0'
        run: python experiment.py report --run runs/actions --output REPORT-actions.md
      - name: Preserve results, including incomplete runs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: laya-experiment
          path: |
            runs/actions/
            data/snapshot.json
            REPORT-actions.md
          if-no-files-found: error
          retention-days: 14
