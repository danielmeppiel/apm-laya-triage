name: Triage one issue

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Public microsoft/apm issue number; predictions only, no label writes"
        required: true
        type: string
      precision:
        description: "INT8 is experimental until its accuracy comparison is complete"
        type: choice
        options: [fp32, int8]
        default: fp32
      threads:
        description: "CPU threads; speed comparisons are recorded separately"
        type: choice
        options: ["2", "4"]
        default: "2"

permissions:
  contents: read

jobs:
  triage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      USE_TF: "0"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: python
        with:
          python-version: "3.12"
      - name: Restore the exact Python runtime
        id: runtime
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .venv
          key: cpu-venv-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements.txt') }}
      - name: Install pinned CPU dependencies on cache miss
        if: steps.runtime.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          .venv/bin/python -m pip install -r requirements.txt
      - name: Read and classify one issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue_number }}
          PRECISION: ${{ inputs.precision }}
          THREADS: ${{ inputs.threads }}
        run: .venv/bin/python -u triage_one.py --issue "$ISSUE" --threads "$THREADS" --precision "$PRECISION"
      - name: Upload predictions and measured timings
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: issue-${{ inputs.issue_number }}-prediction
          path: runs/single-issue/result.json
          if-no-files-found: error
          retention-days: 14
